version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/downloads:/app/backend/downloads
    depends_on:
      - redis
    command: node dist/server.js

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/downloads:/app/backend/downloads
    depends_on:
      - redis
    command: node dist/worker.js

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/downloads:/app/backend/downloads:ro
    depends_on:
      - app

volumes:
  redis_data:
